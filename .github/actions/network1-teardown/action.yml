name: Clear the network1 staging tree
description: >-
  Remove this run's tree from the peer. Call once, with `if: always()`. The network1
  pytest action already stopped its own daemon; the sweep here only catches a
  run that died before reaching that step.

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set +e
        # network1-stage may never have run, so assume nothing.
        [ -n "${REMOTE_WORKDIR:-}" ] || exit 0
        [ -r "${NETWORK1_SSH_HELPER:-}" ] || exit 0
        source "$NETWORK1_SSH_HELPER"

        network1_ssh "pkill -f 'python -m simpler.remote_l3_worker --host ${REMOTE_DAEMON_HOST}' || true"
        # A run killed before Worker.close() (runner shutdown, job cancel)
        # leaves mpirun and its simpler.mpi_l3_session ranks alive holding the
        # fixed command/health ports, so the next run's rank bind fails. The
        # runner is single-job, so any survivor on either machine is ours.
        pkill -f 'simpler[.]mpi_l3_session'
        network1_ssh "pkill -f 'simpler[.]mpi_l3_session' || true"
        if [ -n "${NETWORK1_MPI_PYTHON:-}" ]; then
          rm -f "$NETWORK1_MPI_PYTHON"
          network1_ssh "rm -f '$NETWORK1_MPI_PYTHON'"
        fi
        # rm -rf on a tree a surviving chip child is still writing fails with
        # ENOTEMPTY, so retry once after giving it a moment.
        network1_ssh "rm -rf '$REMOTE_WORKDIR' 2>/dev/null || { sleep 5; rm -rf '$REMOTE_WORKDIR'; }"
        exit 0

name: Cache pip packages
description: Restore and save the per-runner pip cache.

runs:
  using: composite
  steps:
    - name: Cache pip packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-${{ runner.arch }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-pip-

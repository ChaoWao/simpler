name: NPU Pod Scene Tests

permissions:
  contents: read

# A pod job spans two machines: the runner it lands on drives its peer entirely
# over ssh, and the peer runs no workflow code. Every value that identifies
# either machine — addresses, device split, ports, staging root, proxy — comes
# from the runner's own .env, so nothing machine-specific lives in this file.
# See docs/ci.md for the action boundaries and examples/workers/README.md for
# how an example plugs into it.
on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      platform:
        description: a2a3 or a5.
        required: true
        type: string
      runs_on:
        required: true
        type: string

jobs:
  run:
    name: st-pod-onboard-${{ inputs.platform }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 60
    # A runner claim covers only the machine the job landed on; the peer is
    # driven over ssh and nothing else knows it is busy. Two runs of this job
    # would then share the peer's devices and its POD_L3_DAEMON_PORT. The group
    # is deliberately free of github.ref so runs from different PRs collide
    # here, and cancel-in-progress stays false because a cancelled job is
    # SIGKILLed before pod-teardown can clear the peer.
    concurrency:
      group: pod-${{ inputs.platform }}
      cancel-in-progress: false
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "4000"

    steps:
      # Each pod machine carries one .env describing itself and its peer, so
      # this job never has to work out which machine it landed on.
      - name: Load pod machine config
        run: |
          set -euo pipefail

          # The runner root holds .env and sits two levels above
          # RUNNER_WORKSPACE (<root>/_work/<repo>). POD_ENV_FILE overrides the
          # derivation for a runner laid out differently.
          ENV_FILE="${POD_ENV_FILE:-$(dirname "$(dirname "$RUNNER_WORKSPACE")")/.env}"
          if [ ! -r "$ENV_FILE" ]; then
            echo "::error::pod config not readable: $ENV_FILE (set POD_ENV_FILE to override)"
            exit 1
          fi
          echo "pod config: $ENV_FILE"

          # The runner service reads this same file for its own settings, so
          # only POD_* is accepted here — an unrelated key in it must not reach
          # the job environment through this step.
          while IFS= read -r line || [ -n "$line" ]; do
            line=${line%$'\r'}
            line=${line#"${line%%[![:space:]]*}"}
            case "$line" in ''|'#'*) continue ;; esac
            [[ "$line" == *=* ]] || continue
            key=${line%%=*}
            value=${line#*=}
            [[ "$key" =~ ^POD_[A-Z0-9_]+$ ]] || continue
            value=${value%"${value##*[![:space:]]}"}
            case "$value" in
              \"*\") value=${value#\"}; value=${value%\"} ;;
              \'*\') value=${value#\'}; value=${value%\'} ;;
            esac
            printf -v "$key" '%s' "$value"
          done < "$ENV_FILE"

          set_default() {
            local name=$1
            shift
            [ -n "${!name-}" ] || printf -v "$name" '%s' "$*"
          }
          set_default POD_LOCAL_IP ""
          set_default POD_REMOTE_USER ""
          set_default POD_REMOTE_SSH_PORT 22
          set_default POD_L3_DAEMON_PORT 19073
          set_default POD_L3_SESSION_TIMEOUT_S 180
          set_default POD_L3_SESSION_LISTEN_HOST 0.0.0.0
          set_default POD_REMOTE_STAGING_ROOT /data/workspace/ci-runner/pod-ci
          set_default POD_REMOTE_STAGING_TTL_DAYS 2
          set_default POD_DAEMON_WAIT_S 120
          set_default POD_SMOKE_TIMEOUT_S 1800
          set_default POD_CANN_ENV /usr/local/Ascend/cann/set_env.sh
          set_default POD_REMOTE_CANN_ENV "$POD_CANN_ENV"
          set_default POD_HTTP_PROXY ""
          set_default POD_HTTPS_PROXY ""
          set_default POD_NO_PROXY ""
          # Each machine runs its own proxy on its own port, and the peer's
          # values are evaluated on the peer — a loopback address here and
          # there name two different proxies. Unset means "same as this
          # machine's", which only holds for a shared LAN proxy.
          set_default POD_REMOTE_HTTP_PROXY "$POD_HTTP_PROXY"
          set_default POD_REMOTE_HTTPS_PROXY "$POD_HTTPS_PROXY"
          set_default POD_REMOTE_NO_PROXY "$POD_NO_PROXY"

          # A proxy nothing listens on turns every pip call into five retries
          # ending in an opaque ProxyError, several steps from the setting that
          # caused it. Name the address here instead.
          proxy_reachable() {
            local hostport=${1#*://} host port
            hostport=${hostport##*@}
            hostport=${hostport%%/*}
            host=${hostport%:*}
            port=${hostport##*:}
            [ "$host" != "$port" ] || port=80
            (exec 3<>"/dev/tcp/$host/$port") 2>/dev/null
          }
          for key in POD_HTTP_PROXY POD_HTTPS_PROXY; do
            if [ -n "${!key}" ] && ! proxy_reachable "${!key}"; then
              echo "::error::$key=${!key} is not reachable from this machine"
              exit 1
            fi
          done

          MISSING=0
          for key in POD_MACHINE POD_LOCAL_DEVICES POD_REMOTE_MACHINE POD_REMOTE_HOST POD_REMOTE_DEVICES; do
            if [ -z "${!key-}" ]; then
              echo "::error::$key is missing from $ENV_FILE"
              MISSING=1
            fi
          done
          [ "$MISSING" = 0 ] || exit 1

          # The file is the source of truth for identity; this only catches the
          # wrong machine's .env having been copied onto this runner.
          if [ -n "$POD_LOCAL_IP" ] && ! hostname -I | tr ' ' '\n' | grep -qx "$POD_LOCAL_IP"; then
            echo "::error::POD_LOCAL_IP=$POD_LOCAL_IP is not an address of this host"
            hostname -I || true
            exit 1
          fi

          for key in POD_MACHINE POD_LOCAL_IP POD_LOCAL_DEVICES \
                     POD_REMOTE_MACHINE POD_REMOTE_HOST POD_REMOTE_DEVICES \
                     POD_REMOTE_USER POD_REMOTE_SSH_PORT \
                     POD_L3_DAEMON_PORT POD_L3_SESSION_TIMEOUT_S POD_L3_SESSION_LISTEN_HOST \
                     POD_REMOTE_STAGING_ROOT POD_REMOTE_STAGING_TTL_DAYS \
                     POD_DAEMON_WAIT_S POD_SMOKE_TIMEOUT_S \
                     POD_CANN_ENV POD_REMOTE_CANN_ENV \
                     POD_HTTP_PROXY POD_HTTPS_PROXY POD_NO_PROXY \
                     POD_REMOTE_HTTP_PROXY POD_REMOTE_HTTPS_PROXY POD_REMOTE_NO_PROXY; do
            printf '%s=%s\n' "$key" "${!key-}" >> "$GITHUB_ENV"
          done

          echo "pod machine=${POD_MACHINE} ip=${POD_LOCAL_IP:-unset} devices=${POD_LOCAL_DEVICES}"
          echo "pod peer=${POD_REMOTE_MACHINE} host=${POD_REMOTE_HOST}:${POD_REMOTE_SSH_PORT} devices=${POD_REMOTE_DEVICES}"

      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up environment
        uses: ./.github/actions/setup-venv
        with:
          packages: ".[test]"
          install-torch: "false"
          system-site-packages: "true"
          source-cann: "true"
          cann-env: ${{ env.POD_CANN_ENV }}
          http-proxy: ${{ env.POD_HTTP_PROXY }}
          https-proxy: ${{ env.POD_HTTPS_PROXY }}
          no-proxy: ${{ env.POD_NO_PROXY }}

      # Staging and the peer-side build are per-run: every example below runs
      # against the same tree and the same venv, so re-staging per example
      # would repeat the whole cost of the job.
      - name: Stage the checkout on the peer
        uses: ./.github/actions/pod-stage

      # continue-on-error so a second example still runs when the first fails —
      # one round of this job occupies two machines, and finding out about only
      # the first failure wastes the second half of it. The summary step below
      # is what makes the job red.
      - name: vector_add_mixed_l3
        id: vector-add-mixed-l3
        continue-on-error: true
        uses: ./.github/actions/pod-run-example
        with:
          example: vector_add_mixed_l3
          env-prefix: SIMPLER_VECTOR_ADD_MIXED_L3
          parent-script: examples/workers/l4/vector_add_mixed_l3/run_parent.sh

      - name: Clear the pod staging tree
        if: always()
        uses: ./.github/actions/pod-teardown

      # continue-on-error rewrites a failed example's `conclusion` to success
      # and leaves the truth in `outcome`, so this is the only step whose
      # result means the examples passed.
      - name: Report pod example results
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.vector-add-mixed-l3.outcome }}" = "success" ] || FAILED="$FAILED vector_add_mixed_l3"
          if [ -n "$FAILED" ]; then
            echo "::error::pod examples failed:$FAILED"
            exit 1
          fi
          echo "all pod examples passed"

      # Both sides' device logs and each daemon's output land under the run
      # directory and stay on the runner otherwise. A device-side failure — a
      # scheduler timeout on the peer, say — names its sub-class only there, so
      # without this the run page shows the host traceback and nothing that
      # explains it.
      - name: Upload pod logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pod-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/pod-ci-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7

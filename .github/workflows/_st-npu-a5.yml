name: NPU Scene Tests (a5)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      runs_on:
        required: true
        type: string
      include_dfx_smokes:
        required: false
        default: false
        type: boolean

jobs:
  run:
    name: st-onboard-a5
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 60
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "4000"
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Restore scene-test kernel cache (a5)
        uses: actions/cache@v5
        with:
          path: build/cache/kernels
          key: scene-kernels-a5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pto_isa.pin') }}-${{ inputs.ref || github.sha }}
          restore-keys: |
            scene-kernels-a5-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pto_isa.pin') }}-

      - name: Set up environment
        uses: ./.github/actions/setup-venv
        with:
          build-packages: "scikit-build-core nanobind cmake>=3.15"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a5 .[test]"
          install-torch: "false"
          system-site-packages: "true"
          source-cann: "false"

      - name: Compile scene-test kernels (a5)
        run: |
          .venv/bin/python -m simpler_setup.tools.scene_test_compile examples tests/st \
            --platform a5 --exclude-level 4 --require-pto-isa --compile-workers 8 -q

      - name: Run pytest scene tests (a5)
        run: |
          DEVICE_LIST=$(.venv/bin/python -c "p='${DEVICE_RANGE}'.split('-'); s,e=p[0],p[-1]; print(','.join(str(i) for i in range(int(s),int(e)+1)))")
          task-submit --timeout 1800 --max-time 1800 --device "$DEVICE_LIST" \
            --run ".venv/bin/python -m pytest examples tests/st --platform a5 --exclude-level 4 --device ${DEVICE_RANGE} -v --require-pto-isa --pto-session-timeout 1200"

      - name: DFX smokes (a5)
        if: inputs.include_dfx_smokes
        uses: ./.github/actions/run-onboard-dfx-smokes
        with:
          platform: a5

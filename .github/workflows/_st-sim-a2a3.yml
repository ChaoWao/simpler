name: Simulation Scene Tests (a2a3sim)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      repository:
        required: false
        type: string
      ref:
        required: false
        type: string
      runs_on:
        required: true
        type: string
      setup_variant:
        description: github or self-cpu.
        required: true
        type: string
      include_dfx_smokes:
        required: false
        default: false
        type: boolean
      manual_mode:
        description: exclude for Per-PR, include for the Daily full sweep.
        required: false
        default: exclude
        type: string
      python_version:
        required: false
        default: "3.10"
        type: string

jobs:
  run:
    name: st-sim-a2a3sim
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 30
    env:
      MANUAL_MODE: ${{ inputs.manual_mode }}
      SIMPLER_SCHEDULER_TIMEOUT_MS: "5000"
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Validate manual mode
        run: |
          case "$MANUAL_MODE" in
            exclude|include|only) ;;
            *)
              echo "::error::manual_mode must be exclude, include, or only"
              exit 2
              ;;
          esac

      - name: Set up C++ compiler
        if: inputs.setup_variant == 'github'
        uses: ./.github/actions/setup-gcc-15
        with:
          install-graphviz: "true"

      - name: Verify provisioned toolchain
        if: inputs.setup_variant == 'self-cpu'
        run: |
          command -v ninja
          command -v g++
          command -v dot
          if ! command -v g++-15 >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/bin"
            ln -sf "$(command -v g++)" "$RUNNER_TEMP/bin/g++-15"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Set up Python ${{ inputs.python_version }}
        if: inputs.setup_variant == 'github'
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Cache pip packages
        uses: ./.github/actions/cache-pip

      - name: Set up environment
        uses: ./.github/actions/setup-venv
        with:
          build-packages: "scikit-build-core nanobind cmake>=3.15"
          packages: "--no-build-isolation --config-settings=build.targets=build_package_a2a3sim .[test]"

      - name: Run pytest scene tests
        run: |
          .venv/bin/python -m pytest examples tests/st --platform a2a3sim --device 0-15 -v \
            --pto-session-timeout 600 --require-pto-isa \
            --manual "$MANUAL_MODE"

      - name: dep_gen smoke (a2a3)
        if: inputs.include_dfx_smokes
        run: |
          .venv/bin/python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/dep_gen/ \
            --platform a2a3sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" --enable-dep-gen

      - name: dep_gen smoke (a2a3 host_build_graph)
        if: inputs.include_dfx_smokes
        run: |
          .venv/bin/python -m pytest tests/st/a2a3/host_build_graph/dfx/dep_gen/test_dep_gen.py \
            --platform a2a3sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" --enable-dep-gen

      - name: chip_swimlane smoke (a2a3)
        if: inputs.include_dfx_smokes
        run: |
          .venv/bin/python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/chip_swimlane/ \
            --platform a2a3sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" \
            --enable-chip-swimlane --enable-dep-gen

      - name: PMU smoke (a2a3)
        if: inputs.include_dfx_smokes
        run: |
          .venv/bin/python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/pmu/test_pmu.py \
            --platform a2a3sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" --enable-pmu 2

      - name: args_dump smoke (a2a3)
        if: inputs.include_dfx_smokes
        run: |
          .venv/bin/python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/args_dump/test_args_dump.py \
            --platform a2a3sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --manual "${{ inputs.manual_mode == 'only' && 'only' || 'include' }}" --dump-args
